[package]
edition      = "2024"
name         = "weather-advisor"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "weather-advisor"
path = "./src/bin/main.rs"

# Host-testable logic only (parsing, advice rules, text helpers).
[dependencies]
embedded-graphics = "0.8.2"
heapless          = "0.9.3"
log               = "0.4.29"

# Device crates: esp-hal and friends only build for the RISC-V (esp32s31) target.
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { version = "1.2", features = ["esp32s31", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s31",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s31", "log-04"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s31"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s31",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s31", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "1.0.0-beta.2", features = [
  "esp-alloc",
  "esp32s31",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

reqwless = { version = "0.14.0", default-features = false }

# The ESP32-S31 support in the released esp-rs crates is incomplete (Wi-Fi
# connect hangs in esp-radio 1.0.0-beta.1), so the whole esp-rs stack is pinned
# to one esp-hal `main` commit, exactly like the reference
# https://github.com/Hahihula/s31-korvo-1-rust-examples does. The first build
# downloads that commit from GitHub.
[patch.crates-io]
esp-hal                = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-rtos               = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-radio              = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-alloc              = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-println            = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-backtrace          = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
